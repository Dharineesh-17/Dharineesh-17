  <circle cx="120" cy="100" r="10" fill="#00ADB5" stroke="#ffffff" stroke-width="2"/>
  <text x="120" y="80" font-family="Fira Code, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2022</text>
  <text x="120" y="130" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Started coding</text>
  <text x="120" y="143" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">HTML/CSS/JS</text>
  <text x="120" y="156" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Basics</text>
  
  <!-- Node 2: 2023 -->
  <circle cx="270" cy="100" r="10" fill="#00ADB5" stroke="#ffffff" stroke-width="2"/>
  <text x="270" y="80" font-family="Fira Code, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2023</text>
  <text x="270" y="130" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Java + Spring</text>
  <text x="270" y="143" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Boot + React</text>
  <text x="270" y="156" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Full Stack</text>
  
  <!-- Node 3: 2024 -->
  <circle cx="420" cy="100" r="10" fill="#00ADB5" stroke="#ffffff" stroke-width="2"/>
  <text x="420" y="80" font-family="Fira Code, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2024</text>
  <text x="420" y="130" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">AI/ML + Python</text>
  <text x="420" y="143" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">LLMs + RAG</text>
  <text x="420" y="156" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Agent Systems</text>
  
  <!-- Node 4: 2025 -->
  <circle cx="570" cy="100" r="10" fill="#00ADB5" stroke="#ffffff" stroke-width="2"/>
  <text x="570" y="80" font-family="Fira Code, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2025</text>
  <text x="570" y="130" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Production AI</text>
  <text x="570" y="143" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">Multi-agent</text>
  <text x="570" y="156" font-family="Fira Code, monospace" font-size="9" fill="#8b949e" text-anchor="middle">workflows</text>
  
