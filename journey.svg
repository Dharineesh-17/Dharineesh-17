
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="journeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#00ADB5"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="200" rx="16" fill="#0F2027" stroke="#00ADB5" stroke-width="2"/>
  
  <!-- Title -->
